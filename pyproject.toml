[project]
name = "bench-py-v-4"
version = "0.1.0"
description = "Python port of the BENCH v4 NetLogo agent-based model of household building renovation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
